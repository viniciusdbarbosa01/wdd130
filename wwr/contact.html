<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Down the River for reservations, questions, or suggestions about your rafting adventure.">
    <meta name="author" content="Jose Vinicius Dantas Barbosa">

    <title>Contact Us | Down the River</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/wwr_logo.png" alt="Down the River Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <!-- Company Information -->
        <section class="contact-info">
            <p class="company-name">Down the River</p>
            <p>123 River Road</p>
            <p>Fortaleza, CE, Brazil</p>
            <p>(85) 3038-9088</p>
            <p>contact@downtheriver.com</p>
        </section>

        <!-- Map + Contact Form side by side -->
        <div class="contact-layout">

            <section class="map-section">
                <iframe src="https://www.google.com/maps?q=Fortaleza,Brazil&output=embed"
                  loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </section>

            <section class="contact-form">

                <form action="#" method="post">

                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder"
                          required>
                    </div>

                    <fieldset>

                        <legend>Message Purpose</legend>

                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general"
                              required>
                            General Inquiry
                        </label>

                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation">
                            Reservation Question
                        </label>

                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose"
                              value="suggestion">
                            Website Suggestion
                        </label>

                    </fieldset>

                    <div class="form-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Type here"
                          required></textarea>
                    </div>

                    <label class="checkbox" for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>

            </section>

        </div>

        <!-- Employees -->
        <section class="employees-section">

            <h2>We Are Here to Serve You</h2>

            <div class="employees">

                <figure>
                    <img src="images/employee1.jpg" alt="Lucas Silva - River Guide">
                    <figcaption>Lucas Silva<br>River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="João Costa - Operations Manager">
                    <figcaption>João Costa<br>Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpeg" alt="Pedro Souza - Safety Instructor">
                    <figcaption>Pedro Souza<br>Safety Instructor</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 | Jose Vinicius Dantas Barbosa | Down the River</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook_logo.png" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin_logo.png" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/insta_logo.png" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
