<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="poll-form.css">
    <title>Document</title>
</head>
<body>
    <header></header>
    <main>
<form>
    <label for="full name">Full name</label>
    <input type="text" id="fullname" name="fullname" required>
    <label for="Usermail">Email Address</label>
    <input type="text" id="Usermail" name="Usermail" required>
    <label for="Favorite Browser">What is your favorite browser?</label>
    <select name="favorite browser" id="favorite browser">
        <option value="1">Firefox</option>
        <option value="2">Safari</option>
        <option value="3">Chrome</option>
    </select>
   <label for="pet">Do you have a household pet?</label>
   <input type="checkbox" id="pet" name="pet" >
   <label for="feedback">Name the places you have lived:</label>
   <textarea name="feedback" id="feedback" rows="4" placeholder="Fortaleza, Portugal, Piracicaba, Botucatu"></textarea>
   <button type="submit">Submit Poll</button>

</form>
    </main>
    <footer></footer>
</body>
</html>
